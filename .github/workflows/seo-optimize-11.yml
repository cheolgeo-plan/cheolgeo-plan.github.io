          TODAY=datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()
          SITE="https://cheolgeo-plan.github.io/"
          
          
          def one_sub(src, pattern, replacement, label, flags=0):
              new, count=re.subn(pattern,replacement,src,count=1,flags=flags)
              if count!=1:
                  raise ValueError(f"Expected exactly one {label}; check source manually")
              return new
          
          
          def meta_set(src, kind, name, value):
              pattern=rf'(<meta {kind}="{re.escape(name)}" content=")[^"]*(">)'
              return one_sub(src,pattern,lambda m:m.group(1)+value+m.group(2),f'meta {name}')
          
          
          def main_hero(src, new_intro):
              pattern=r'(<section class="inner-hero"><div class="container">[\s\S]*?<h1>[^<]*</h1><p>)([^<]*)(</p>)'
              return one_sub(src,pattern,lambda m:m.group(1)+new_intro+m.group(3),'first hero paragraph')
          
          
          def heading_replace(src, old, new):
              old_tag=f'<h2>{old}</h2>'
              new_tag=f'<h2>{new}</h2>'
              if old_tag in src:
                  if src.count(old_tag)!=1:raise ValueError(f'Duplicate heading: {old}')
                  return src.replace(old_tag,new_tag,1)
              if new_tag in src:
                  return src
              raise ValueError(f'Missing known heading: {old}')
          
          
          def set_structured_data(src,title,description):
              pat=r'(<script type="application/ld\+json">)([\s\S]*?)(</script>)'
              m=re.search(pat,src)
              if not m:raise ValueError('Missing JSON-LD')
              data=json.loads(m.group(2))
              webpages=[x for x in data.get('@graph',[]) if x.get('@type')=='WebPage']
              if len(webpages)!=1:raise ValueError('Unexpected WebPage schema')
              webpages[0]['name']=title
              webpages[0]['description']=description
              serialized=json.dumps(data,ensure_ascii=False,separators=(', ', ': '))
              return src[:m.start(2)]+serialized+src[m.end(2):]
          
          
          def modified_date(src):
              src=meta_set(src,'property','article:modified_time',TODAY)
              src=one_sub(src,r'(게시 \d{4}-\d\d-\d\d · 수정 )\d{4}-\d\d-\d\d',lambda m:m.group(1)+TODAY,'visible modification date')
              pat=r'(<script type="application/ld\+json">)([\s\S]*?)(</script>)'
              m=re.search(pat,src)
              data=json.loads(m.group(2))
              web=next(x for x in data['@graph'] if x.get('@type')=='WebPage')
              web['dateModified']=TODAY
              serialized=json.dumps(data,ensure_ascii=False,separators=(', ', ': '))
              return src[:m.start(2)]+serialized+src[m.end(2):]
          
          
          def update_one(src,path,spec):
              old=src
              title=spec['title']
              desc=spec['description']
              # Exact-title consistency across HTML, sharing metadata, and WebPage schema.
              src=one_sub(src,r'(<title>)[^<]*(</title>)',lambda m:m.group(1)+title+m.group(2),'page title')
              for kind,name,value in [('name','description',desc),('property','og:title',title),('property','og:description',desc),('name','twitter:title',title),('name','twitter:description',desc)]:
                  src=meta_set(src,kind,name,value)
              src=set_structured_data(src,title,desc)
              if spec['hero']:
                  src=main_hero(src,spec['hero'])
              for before,after in spec['h2'].items():
                  src=heading_replace(src,before,after)
              # Protect existing UI and SEO identity.
              for marker in ('naver-site-verification','google-site-verification','landing-consultation.webp','application/ld+json'):
                  if src.count(marker)!=old.count(marker):
                      raise ValueError(f'Unexpected removal of {marker}: {path}')
              form_marker='1FAIpQLSfdzNitwdwclnvlcy6wj8D73z8kBuRSHsiyCp-L3XB9agx9bQ'
              if src.count(form_marker)!=old.count(form_marker):raise ValueError(f'Form link changed: {path}')
              canonical=f'<link rel="canonical" href="{SITE}{path.removesuffix("index.html")}">'
              if canonical not in src:raise ValueError(f'Canonical unexpectedly changed: {path}')
              kw=spec['keyword']
              h1=re.search(r'<h1>([^<]*)</h1>',src)
              hs=re.findall(r'<h2>([^<]*)</h2>',src)
              first_hero=re.search(r'<section class="inner-hero">[\s\S]*?<h1>[^<]*</h1><p>([^<]*)</p>',src)
              if not h1 or kw not in h1.group(1) or not first_hero or kw not in first_hero.group(1):
                  raise ValueError(f'Missing H1 or first paragraph keyword: {path}')
              if not title.startswith(kw+' |') or not desc.startswith(kw) or not any(kw in h for h in hs):
                  raise ValueError(f'Keyword must be in TITLE/DESCRIPTION/H2: {path}')
              # Only changed documents receive a new modification date, never publication date.
              if src!=old:
                  src=modified_date(src)
              return src
          
          
          def main():
              site=Path('sitemap.xml')
              sitemap=site.read_text(encoding='utf-8')
              updates=[]
              for filename,spec in SPECS.items():
                  path=Path(filename)
                  if not path.is_file():raise FileNotFoundError(filename)
                  prior=path.read_text(encoding='utf-8')
                  updated=update_one(prior,filename,spec)
                  if prior!=updated:
                      path.write_text(updated,encoding='utf-8')
                      updates.append(filename)
                      url=SITE+filename.removesuffix('index.html')
                      pat=r'(<loc>'+re.escape(url)+r'</loc>\s*<lastmod>)[^<]+(</lastmod>)'
                      sitemap=one_sub(sitemap,pat,lambda m:m.group(1)+TODAY+m.group(2),f'sitemap {url}')
                  print(f'{filename}: {"MODIFIED" if prior!=updated else "UNCHANGED"} / keyword={spec["keyword"]}')
              if updates:
                  site.write_text(sitemap,encoding='utf-8')
              # Every requested page must still be represented in the sitemap.
              for filename in SPECS:
                  if '<loc>'+SITE+filename.removesuffix('index.html')+'</loc>' not in sitemap:
                      raise ValueError('Missing sitemap URL '+filename)
              print(f'Updated {len(updates)} of {len(SPECS)} pages; sitemap lastmod updated only for changed pages.')
          
          if __name__=='__main__':
              main()
          PY
      - name: Validate HTML edits and show changed files
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Commit changes to website (only in apply mode)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- services/closing-demolition/index.html costs/index.html support/index.html services/restoration/index.html industries/restaurant/index.html industries/cafe/index.html regions/gangnam/index.html regions/mapo/index.html regions/songpa/index.html regions/yeongdeungpo/index.html regions/seongdong/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No updates needed."
          else
            git commit -m "SEO: align target keywords on 11 existing pages"
            git push origin HEAD:main
          fi
