name: SEO Optimize 11 Existing Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first, then choose apply to commit updates to main'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: write

jobs:
  seo-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
