name: Refine Industry and Region Visitor Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run preview first, then apply to commit modifications'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: write

jobs:
  refine-hub-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Replace planning language with practical visitor guidance
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Customer-facing edits to the two static hub pages, not an editorial roadmap.
          Works whether the previous 'expansion plan' proposal was deployed or not.
          """
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re, json, html
          
          BASE='https://cheolgeo-plan.github.io/'
          TODAY=datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
          DESIGNS={
           'industries/index.html': {
              'description':'음식점·카페부터 판매점, 미용실, 학원 등 점포 유형에 따라 달라지는 철거·원상복구 확인사항을 안내합니다. 무료 상담 후 제휴 시공업체의 현장 확인을 통해 견적을 받을 수 있습니다.',
              'hero':'식당과 카페뿐 아니라 판매점, 미용실, 학원 등 점포의 용도에 따라 철거해야 할 시설과 복구 범위가 다릅니다. 내 매장의 설비와 임대차 반환 조건을 확인하고, 필요한 철거 상담을 신청하세요.',
              'lead': '<div class="hub-lead"><span class="eyebrow dark">업종별 철거 안내</span><h2>내 매장과 비슷한 업종부터 살펴보세요.</h2><p>업종마다 고정된 시설과 철거 후 마감해야 할 부분이 다릅니다. 아래 상세 안내에서는 식당의 주방설비와 카페의 카운터·급배수처럼 매장에서 먼저 확인할 사항을 설명합니다.</p></div>',
           },
           'regions/index.html': {
              'description':'서울·수도권 및 충청·영남·호남 지역의 점포철거·원상복구 상담을 안내합니다. 건물 조건과 반출 경로에 따라 공사 방식이 달라지며 도서·산간, 섬 지역은 제한될 수 있습니다.',
              'hero':'점포철거는 같은 업종이라도 건물 위치와 공사 조건에 따라 준비가 달라집니다. 서울과 수도권, 충청·영남·호남 지역의 점포를 정리한다면 건물의 작업 규정과 폐기물 반출 경로부터 확인하세요. 현장 주소를 알려주시면 제휴업체 연결 가능 여부를 확인합니다.',
              'lead':'<div class="hub-lead"><span class="eyebrow dark">지역별 철거 안내</span><h2>점포 위치에 맞는 현장 조건을 확인하세요.</h2><p>건물 유형과 상권에 따라 작업 시간, 승강기 사용, 차량 진입과 폐기물 반출 방식이 달라질 수 있습니다. 아래 지역별 안내에서 실제 현장 점검에 필요한 내용을 살펴보세요.</p></div>',
           },
          }
          STYLE='''<style id="hub-customer-style">
          /* Information panels for visitor-oriented hub pages only */
          .hub-context-section{padding:76px 0 82px;background:#f6f7f5;border-top:1px solid #e4e8e4}
          .hub-context-heading{max-width:850px;margin:0 0 30px}
          .hub-context-heading .hub-context-kicker{display:block;font-size:12px;color:#a85e37;font-weight:800;margin-bottom:12px}
          .hub-context-heading h2{font-size:clamp(26px,3vw,35px);font-weight:850;color:#122e3d;margin:0 0 14px;line-height:1.36;letter-spacing:-.05em}
          .hub-context-heading p{font-size:15px;line-height:1.9;color:#52646b;margin:0}
          .hub-context-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
          .hub-context-card{padding:27px 28px;background:#fff;border:1px solid #dae1dd;border-radius:13px;box-shadow:0 4px 15px rgba(10,35,43,.025)}
          .hub-context-card h3{font-size:20px;font-weight:800;color:#193745;margin:0 0 10px;line-height:1.4}
          .hub-context-card p{font-size:14px;line-height:1.85;color:#526570;margin:0}
          .hub-context-note{margin-top:24px;padding:19px 24px;background:#fff;border:1px solid #d8e1e1;border-left:4px solid #d97947;border-radius:8px}
          .hub-context-note p{font-size:14px;line-height:1.9;color:#51656e;margin:0}
          .hub-context-note a{font-weight:800;color:#a24d26;text-decoration:underline;text-underline-offset:3px}
          @media(max-width:760px){.hub-context-section{padding:50px 0 56px}.hub-context-grid{grid-template-columns:1fr;gap:12px}.hub-context-card{padding:22px}.hub-context-note{padding:18px}}
          </style>'''
          
          def card(title,description):
           return '<article class="hub-context-card"><h3>'+html.escape(title)+'</h3><p>'+html.escape(description)+'</p></article>'
          
          def section_industries():
           c=[
            card('음식점·카페·제과점','주방 후드·덕트, 가스와 급배수, 고정식 카운터와 바닥 마감 등을 살펴야 합니다. 이동식 장비와 건물에 연결된 시설을 구분하면 견적 누락을 줄이는 데 도움이 됩니다.'),
            card('편의점·의류·판매 매장','진열장과 계산대, 냉장·냉동설비, 조명·간판, 쇼윈도 등 해체 범위를 정해야 합니다. 반납·매각할 집기와 폐기할 시설의 소유 관계도 확인하세요.'),
            card('미용실·생활서비스 점포','샴푸대와 급배수 배관, 전기 설비, 거울·파티션 등 고정 인테리어를 확인합니다. 세탁소 등 별도 설비가 있는 점포는 안전한 분리 작업과 잔여 마감 범위를 추가로 점검해야 합니다.'),
            card('학원·스터디카페·업무형 점포','강의실 칸막이와 유리벽, 출입통제·통신 배선, 조명, 바닥·천장 마감처럼 점포 용도에 맞춘 시설을 구분합니다. 건물 기본 설비는 임대인과 협의 없이 임의 철거하지 않는 것이 중요합니다.'),
           ]
           return ('\n<section class="section hub-context-section" aria-labelledby="industry-context-heading"><div class="container">'
             '<div class="hub-context-heading"><span class="hub-context-kicker">업종별 공사 범위 확인</span>'
             '<h2 id="industry-context-heading">점포 유형에 따라 먼저 살펴볼 시설</h2>'
             '<p>같은 면적의 점포라도 주방, 진열설비, 급배수, 칸막이의 설치 상태에 따라 공사 범위가 달라집니다. 내 매장에 해당하는 시설을 살펴보고 철거할 부분과 남길 부분을 구분해 보세요.</p></div>'
             '<div class="hub-context-grid">'+''.join(c)+'</div>'
             '<div class="hub-context-note"><p>철거 상담과 <a href="../support/">희망리턴패키지 점포철거비 지원</a>은 별도 절차입니다. 지원 여부는 업종만으로 결정되지 않으며, 해당 연도의 공고에서 지원 제외업종·임대차·폐업 요건 등을 확인해야 합니다. 폐업철거플랜은 정부 지원금 지급기관이 아닙니다.</p></div>'
             '</div></section>\n')
          
          def section_regions():
           c=[
            card('서울·경기·인천','업무용 빌딩과 복합상가는 공사 승인, 화물승강기 예약, 공용부 보양이 필요할 수 있습니다. 밀집 상권의 1층 매장은 차량 정차와 간판·외부 마감 범위도 확인하세요.'),
            card('대전·세종·충청 지역','상가와 업무공간의 규모·층수뿐 아니라 집기 반출 경로, 건물 관리규정, 폐기물 운반 조건을 함께 살펴야 합니다. 임차인 설치 시설과 건물 공용설비를 구분하는 것이 우선입니다.'),
            card('부산·대구·울산·영남 지역','도심 상업시설과 산업단지 주변 점포는 작업 시간과 차량 진입 여건이 다를 수 있습니다. 실내 해체뿐 아니라 층간 이동, 폐기물 반출, 설비 마감까지 견적서에 포함되는지 확인하세요.'),
            card('광주·전북·전남 지역','거리 점포와 상가건물의 출입구, 계단·승강기, 작업 차량 위치 등을 확인하면 현장 조건을 전달하기 쉽습니다. 임대차 종료일과 집기 반출일을 나눠 공사 일정을 검토하세요.'),
           ]
           return ('\n<section class="section hub-context-section" aria-labelledby="region-context-heading"><div class="container">'
            '<div class="hub-context-heading"><span class="hub-context-kicker">지역별 현장 점검</span>'
            '<h2 id="region-context-heading">지역과 건물 환경에 따라 달라지는 준비사항</h2>'
            '<p>철거 비용과 공사 가능 일정은 지역명만으로 정해지지 않습니다. 건물의 용도, 계단·승강기, 자재 반출 거리, 관리사무소 승인 여부를 함께 확인해야 합니다.</p></div>'
            '<div class="hub-context-grid">'+''.join(c)+'</div>'
            '<div class="hub-context-note"><p>상담·시공 연결은 정확한 주소와 현장 조건을 확인한 뒤 결정됩니다. 강원·제주 지역은 현재 안내 범위에 포함되지 않으며, 도서·산간 지역은 현장 사정에 따라 제한될 수 있습니다. 특히 섬 지역은 장비 및 폐기물 운반 문제로 진행이 어려울 수 있습니다.</p></div>'
            '</div></section>\n')
          
          def replace_one(src,pattern,repl,label):
           out,n=re.subn(pattern,repl,src,count=1,flags=re.S)
           if n!=1:raise ValueError(f'Expected {label} in source')
           return out
          
          def replace_meta(src,key,attr,value):
           escaped=html.escape(value,quote=True)
           return replace_one(src,rf'(<meta {attr}="{re.escape(key)}" content=")[^"]*(">)', lambda m:m.group(1)+escaped+m.group(2), key)
          
          def update_page(path,spec):
           source=path.read_text(encoding='utf-8'); current=source
           # Convert either original 2026-11-04 hub or prior plan-shaped draft.
           current=re.sub(r'<style id="hub-expansion-style">[\s\S]*?</style>\s*','',current,count=1)
           current=re.sub(r'<style id="hub-customer-style">[\s\S]*?</style>\s*','',current,count=1)
           current=re.sub(r'\s*<section class="section hub-expansion-section"[\s\S]*?</section>\s*(?=<section class="section hub-how-section">)','\n',current,count=1)
           current=re.sub(r'\s*<section class="section hub-context-section"[\s\S]*?</section>\s*(?=<section class="section hub-how-section">)','\n',current,count=1)
           current=replace_one(current,
            r'(<section class="inner-hero hub-hero"><div class="container"><div class="eyebrow">[^<]*</div><h1>[^<]*</h1><p>)(.*?)(</p><nav class="breadcrumb")',
            lambda m:m.group(1)+spec['hero']+m.group(3),'hero introduction')
           current=replace_one(current,r'<div class="hub-lead">.*?</div>(\s*<div class="region-grid region-hub-grid">)',
            lambda m:spec['lead']+m.group(1),'existing link card introduction')
           current=current.replace('</head>',STYLE+'\n</head>',1)
           block=section_industries() if path.parts[0]=='industries' else section_regions()
           anchor='<section class="section hub-how-section">'
           if current.count(anchor)!=1:raise ValueError('Missing unique contact preparation section')
           current=current.replace(anchor,block+anchor,1)
           for attr,key in [('name','description'),('property','og:description'),('name','twitter:description')]:
            current=replace_meta(current,key,attr,spec['description'])
           match=re.search(r'(<script type="application/ld\+json">)(.*?)(</script>)',current,re.S)
           if not match:raise ValueError('Missing structured data')
           obj=json.loads(match.group(2)); ws=[o for o in obj['@graph'] if o.get('@type')=='WebPage']
           if len(ws)!=1:raise ValueError('Unexpected WebPage nodes')
           ws[0]['description']=spec['description'];ws[0]['dateModified']=TODAY
           current=current[:match.start(2)]+json.dumps(obj,ensure_ascii=False,separators=(', ',': '))+current[match.end(2):]
           current=replace_meta(current,'article:modified_time','property',TODAY)
           # Strict preservation of consult form, published linked cards, canonical/title/verification, original publication.
           form='1FAIpQLSfdzNitwdwclnvlcy6wj8D73z8kBuRSHsiyCp-L3XB9agx9bQ'
           for token in [form,'naver-site-verification','google-site-verification','og:site_name','article:published_time','rel="canonical"','rel="icon"']:
            if source.count(token)!=current.count(token):raise ValueError(f'Unexpected change in protected {token}: {path}')
           expected={'industries': ['restaurant','cafe'],'regions':['gangnam','mapo','songpa','yeongdeungpo','seongdong']}[path.parts[0]]
           for slug in expected:
            link=f'<a href="../{path.parts[0]}/{slug}/" class="region-card">'
            if source.count(link)!=1 or current.count(link)!=1:raise ValueError('Expected published card preserved: '+slug)
           for phrase in ('확장 계획','상세 페이지 준비 중','순차적으로 추가할','예정된'):
            if phrase in current: raise ValueError('Public planning language remained: '+phrase)
           if current.count('class="section hub-context-section"')!=1:raise ValueError('Missing new content section')
           if current!=source:
            path.write_text(current,encoding='utf-8')
            return True
           return False
          
          if __name__=='__main__':
           changed=[]
           for name,spec in DESIGNS.items():
            path=Path(name)
            if not path.exists():raise FileNotFoundError(str(path))
            if update_page(path,spec):changed.append(name)
            print(('UPDATED' if name in changed else 'UNCHANGED'),name)
           if changed:
            sm=Path('sitemap.xml'); s=sm.read_text(encoding='utf-8')
            for path in changed:
             url=BASE+path.removesuffix('index.html')
             pat=r'(<loc>'+re.escape(url)+r'</loc>\s*<lastmod>)[^<]+(</lastmod>)'
             s,n=re.subn(pat,lambda m:m.group(1)+TODAY+m.group(2),s,count=1)
             if n!=1:raise ValueError('Missing sitemap URL: '+url)
            sm.write_text(s,encoding='utf-8')
           print('VALIDATED: 2 visitor-facing hubs, only actual published links, no editorial roadmap displayed.')
          PY
      - name: Validate changed files
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
          echo "Only the industry hub, region hub, and sitemap should change."
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'industries/index.html','regions/index.html','sitemap.xml'}
          assert paths.issubset(allowed), f'Unexpected changes: {paths-allowed}'
          print(f'VALIDATED {len(paths)} files: {sorted(paths)}')
          PY
      - name: Commit visitor-focused updates (apply only)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- industries/index.html regions/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Improve industry and region hubs for visitors'
            git push origin HEAD:main
          fi
