name: SEO Body Improve 11 Existing Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run preview first, then apply to save to main'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: write

jobs:
  body-seo-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Enrich 76 content sections across 11 pages
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """11-page on-site body improvements; idempotent; designed for GitHub Actions."""
          import re, json, html
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          SPECS = json.loads(r'''{"services/closing-demolition/index.html":{"keyword":"폐업철거","additions":["계약서상 반환 의무에 포함되지 않는 비품까지 철거 대상으로 잡지 않도록, 공사 요청서에 반출 물품과 남길 시설을 구분해 적어두세요. 폐기물 처리와 마감 복구를 각각 누구에게 맡길지도 확인해야 합니다.","임대인에게는 폐업철거 뒤 바닥·벽·천장을 어느 상태로 인도해야 하는지 항목별로 확인받는 편이 좋습니다. 현장 사진에 철거·유지 표시를 해 전달하면 견적 범위의 해석 차이를 줄일 수 있습니다.","사진은 출입구에서 촬영한 매장 전경, 고정 설비의 연결 부분, 폐기물 반출 경로 순으로 준비하세요. 계단이나 승강기 제한이 있으면 현장 방문 전에 전달하는 편이 일정 조정에 도움이 됩니다.","폐업철거 전에 냉장고·집기 등 매각할 장비의 반출 날짜를 먼저 잡고, 고정식 카운터나 벽체처럼 전문 해체가 필요한 부분은 별도 목록으로 분리하세요. 반출 책임자가 겹치면 공사 일정이 지연될 수 있습니다.","폐업철거 완료 기준을 문서로 남길 때는 노출된 배선·배관의 마감, 바닥 타공 흔적, 폐기물 잔여 여부도 포함하세요. 공사 후 같은 각도로 촬영한 사진을 활용하면 인도 당시 상태를 확인하기 쉽습니다."]},"costs/index.html":{"keyword":"상가철거비용","additions":["현장 사진을 요청할 때는 천장 속 배관이나 바닥에 고정된 설비처럼 사진만으로 보이지 않는 조건도 질문해야 합니다. 이러한 부분은 현장 확인 후 견적이 조정될 수 있으므로 견적서에 확인 전제 조건을 남겨두는 것이 좋습니다.","견적서에 폐기물 운반·처리, 화물승강기 사용, 공용부 보양, 바닥 보수, 부가세가 각각 포함되는지 확인하세요. 같은 명칭의 철거 공사라도 포함 항목이 다르면 총액을 직접 비교하기 어렵습니다.","상가철거비용 상담에서는 점포 면적뿐 아니라 철거 대상 사진과 임대인의 원상복구 요구를 함께 전달하세요. 실제 반출 가능한 출입구 폭이나 층수도 알려주면 현장 확인이 필요한 이유를 설명받기 쉽습니다.","상가철거비용 비교표에 각 업체의 포함 항목을 같은 순서로 적고, 불명확한 부분은 제외인지 추가 견적인지 표시하세요. 예를 들어 간판 철거는 포함되지만 외벽 보수가 빠져 있다면 별도로 확인해야 합니다.","상가철거비용 변경 가능성이 있는 작업은 발견 조건과 승인 절차를 계약 전에 정하는 편이 안전합니다. 예상 밖의 시설을 발견하면 사진·추가 범위·금액을 먼저 공유하고 동의 후 진행하는 방식인지 확인하세요."]},"support/index.html":{"keyword":"점포철거비 지원","additions":["지원 사업의 신청 대상, 인정 공사 범위, 제출 서류는 공고 연도에 따라 달라질 수 있습니다. 민간 철거 상담을 받는 것과 정부 지원사업에 선정되는 것은 별개이므로 공식 접수처의 안내를 기준으로 판단해야 합니다.","자료는 계약 단계, 철거 전, 공사 진행, 공사 완료, 대금 지급 단계별로 구분해 보관하면 추후 확인하기 편리합니다. 점포철거비 지원 신청에 실제로 어떤 자료가 필요한지는 해당 연도 공식 공고로 다시 검증해야 합니다.","점포철거비 지원은 개인의 예상 비용이나 민간 업체의 상담 결과만으로 확정되지 않습니다. 다음 연도 지원 여부와 소급 인정 가능성도 공식 모집·정산 기준이 발표되기 전에는 단정할 수 없습니다.","동일한 위치에서 공사 전후를 촬영하고 촬영 날짜와 장소를 함께 기록해 두면 공사 범위 확인에 도움이 됩니다. 단, 점포철거비 지원의 인정 사진 형식이나 제출 기준으로 확정된 것은 아니므로 공고를 확인해야 합니다.","점포철거비 지원 관련 증빙을 대비한다면 실제 계약 주체, 공급 내용, 결제 주체와 금액이 서로 일치하는지 확인하세요. 계약서만 있고 지급을 입증할 자료가 없으면 공사비 확인이 어려워질 수 있습니다."]},"services/restoration/index.html":{"keyword":"상가 원상복구","additions":["계약서에 “원상복구”라고만 적혀 있다면 바닥, 천장, 간판, 설비를 항목별로 나누어 임대인과 인도 상태를 합의하세요. 남겨도 되는 시설과 제거할 시설을 현장 사진에 표시하면 공사 지시가 명확해집니다.","견적서에서 철거는 기존 시설의 해체·반출을, 복구는 바닥·벽·천장 등 인도 상태를 맞추는 마감 작업을 뜻하는지 확인하세요. 두 작업의 범위와 제외 항목을 나누어 적으면 재작업을 줄일 수 있습니다.","상가 원상복구 일정은 철거 종료일과 점포 인도일을 같은 날로 가정하지 않고 잡는 편이 좋습니다. 관리사무소 승인, 폐기물 반출, 청소와 임대인 최종 확인에 필요한 시간을 따로 확보하세요.","상가 원상복구 범위를 판단할 입점 전 사진이 없다면 인수인계서와 시설 양수도 계약, 관리사무소 보유 자료 등 확인 가능한 기록부터 모으세요. 자료가 불충분한 부분은 임대인과 합의 내용을 남기는 것이 중요합니다.","상가 원상복구를 마친 뒤에는 바닥 타공, 벽면 고정부, 전기·배관 마감과 폐기물 잔여 여부를 점검하세요. 최종 상태를 같은 위치에서 촬영하고 인도 과정에서 나온 요청을 별도로 기록해 두는 것이 좋습니다."]},"industries/restaurant/index.html":{"keyword":"식당 폐업철거","additions":["식당 폐업철거 견적에서는 이동식 냉장고와 고정식 후드·덕트를 같은 해체 공정으로 묶지 않는 편이 좋습니다. 중고로 판매할 장비는 반출 주체와 날짜를, 건물 연결 설비는 차단·마감 책임을 구분하세요.","주방 타일 아래 방수층이나 천장 내부 덕트 연결부처럼 철거 후 드러나는 부분도 확인 대상입니다. 현장 확인 전에 알기 어려운 항목은 확정 공사와 추가 협의 가능 항목으로 나눠 견적받을 수 있습니다.","식당 폐업철거 사진은 장비를 멀리서 한 장만 찍지 말고 후드의 외벽 연결, 배수구 위치, 가스 차단 위치를 각각 촬영하세요. 철거 전 장비의 소유권과 임대인의 보존 요청도 상담 시 전달해야 합니다.","식당 폐업철거 견적의 작업 목록에 냉장고 반출, 고정 설비 해체, 폐기물 처리, 바닥·벽 복구를 구분해서 적으세요. 항목별 포함 여부를 같은 기준으로 확인하면 견적 비교가 쉬워집니다.","식당 폐업철거 전에 인수할 주방기기를 서면 목록으로 확인하고, 양도 대상에 연결 배관이나 후드가 포함되는지도 확인해야 합니다. 양도 계약이 끝나기 전에 고정 설비를 철거하면 원상복구 범위를 다시 정해야 할 수 있습니다.","식당 폐업철거 중 가스 계통 차단, 전기 회로 분리, 배수관 마감은 관련 절차와 안전조치를 갖춘 담당자에게 확인해야 합니다. 설비를 제거한 뒤 누출·누수 여부를 누가 최종 확인하는지도 견적에서 구분하세요.","식당 폐업철거 날짜는 마지막 영업일과 같게 잡기보다 식재료 처분, 중고 기기 반출, 전기·가스 안전조치 이후로 계획하세요. 다른 업체가 물품을 수거한다면 철거 작업과 동선이 겹치지 않게 일정을 맞추는 편이 좋습니다.","식당 폐업철거 완료 사진은 철거 전 설비와 철거 후 연결부를 가능한 한 같은 위치에서 남기세요. 방수층이나 배관 마감처럼 사진으로 충분히 판단하기 어려운 부분은 현장 확인 내용도 함께 기록해야 합니다."]},"industries/cafe/index.html":{"keyword":"카페 폐업철거","additions":["카페 폐업철거 범위표에는 머신·제빙기 같은 이동식 장비와 바닥에 고정된 카운터·싱크대의 해체를 따로 표시하세요. 장비 매각이 예정돼 있다면 손상 없이 분리할 담당자도 정해두는 편이 좋습니다.","커피머신의 급수·배수 연결 지점과 제빙기 배관, 벽면 콘센트 증설 부분을 사진으로 기록하세요. 철거 뒤 막거나 복구할 부분은 임대인과 협의한 상태를 기준으로 판단해야 합니다.","카페 폐업철거 일정에는 원재료·비품 정리, 장비 판매·반출, 고정 설비 철거, 마감 확인을 별도 단계로 잡으세요. 최종 인도일까지 여유가 없는 경우 어느 단계에서 병목이 생기는지 먼저 점검하는 것이 좋습니다.","카페 폐업철거에서는 바 카운터가 바닥에 고정돼 있는지, 급배수관이 바닥이나 벽을 통과하는지, 별도 전기 회로가 연결되는지를 함께 확인해야 합니다. 표면에서 보이는 철거 범위와 실제 마감 공사가 다를 수 있습니다.","카페 폐업철거에서는 베이커리 오븐이나 추가 배기설비가 있는 공간을 일반 음료 매장과 별도로 검토하세요. 고온 설비와 배수·환기 연결부의 안전조치가 견적에 포함되는지도 확인해야 합니다.","카페 폐업철거에서 외부 간판을 제거한다면 고정부 구멍, 외벽 마감, 조명 배선 처리까지 필요한지 확인하세요. 건물 외관에 영향을 주는 부분은 임대인이나 관리주체의 사전 협의가 필요할 수 있습니다.","카페 폐업철거 전에 중고 장비의 회수 날짜를 확인하고 카운터와 연결된 배관 해체 순서를 조율하세요. 회수 업체와 철거업체가 분리되어 있다면 연결부 마감 책임도 미리 정해두는 편이 좋습니다.","카페 폐업철거 후 매장 전체 사진만으로는 카운터 철거 뒤 남은 타공 흔적과 급배수 마감 상태를 확인하기 어렵습니다. 카운터 자리, 출입구, 외부 간판 고정부를 각각 점검하고 반환 조건과 대조하세요."]},"regions/gangnam/index.html":{"keyword":"강남구 폐업철거","additions":["강남구 폐업철거 상담에서 역삼동 업무시설을 다룬다면 관리사무소의 공사 신청 양식과 화물승강기 사용 가능 시간을 먼저 확인하세요. 임차인 설치 배선과 공용 소방설비를 구분한 사진도 준비하면 좋습니다.","강남구 폐업철거 중 논현동 음식점처럼 덕트가 공용 배기구에 연결된 점포는 철거 경계와 마감 책임을 계약 전에 정해야 합니다. 단순히 덕트 전체를 제거한다고 가정하면 안 됩니다.","강남구 폐업철거에서 신사동 노면 매장은 쇼윈도·간판 고정부와 보행로 반출 동선을 함께 확인하세요. 실내 철거와 외벽 보수가 별도 견적에 해당하는지도 비교해야 합니다.","강남구 폐업철거 현장에서 승강기를 예약해야 하는 업무시설과 전면 출입구로 반출하는 매장은 작업 순서가 다를 수 있습니다. 반출 동선이 겹치는 다른 입주자가 있는지 관리주체에 확인해 일정에 반영하세요.","강남구 폐업철거 일정은 작업일만 정하지 말고 승강기 예약일, 폐기물 반출일, 임대인 인도일을 구분해 계획하세요. 공사 승인과 실제 출입 가능 시간이 다를 수 있기 때문입니다.","건물 관리 규정이 있다면 관련 승인 서류를, 노면상가라면 간판·유리·외부 시설 사진을 함께 제출하세요. 업종과 고정 설비 목록이 있으면 방문 견적 시 확인할 범위를 좁히는 데 도움이 됩니다.","강남구 폐업철거 후에는 공용부 보양 해체 상태와 현장 내부 마감 상태를 각각 점검하세요. 임대인 인도 확인과 관리사무소의 시설 확인은 별개일 수 있습니다.","현장 주소는 동 이름뿐 아니라 건물의 층수·출입구 구조까지 적고, 철거 희망일과 임대차 종료일을 구분해 전달하세요. 상담 접수 후 실제 작업 가능 여부는 제휴업체가 확인합니다."]},"regions/mapo/index.html":{"keyword":"마포구 폐업철거","additions":["마포구 폐업철거에서 서교동 음식점의 후드·덕트를 정리할 때는 공용 배기 시설인지 임차인 설치물인지 먼저 확인하세요. 주방 바닥·벽 방수 마감을 복구해야 하는지도 견적에 분리해 표시하는 편이 좋습니다.","마포구 폐업철거 대상이 합정동 카페라면 카운터 철거뿐 아니라 제빙기·커피머신의 급배수 연결과 증설 콘센트의 처리 방법을 함께 확인하세요. 장비 인수 여부에 따라 작업 범위가 달라질 수 있습니다.","마포구 폐업철거를 준비하는 연남동 골목 매장은 차량 정차 가능 위치와 계단 반출 인력을 따로 확인하세요. 좁은 출입구를 통과하기 어려운 장비는 사전 분해나 별도 반출 계획이 필요할 수 있습니다.","마포구 폐업철거를 계획할 때는 같은 구 안에서도 매장 출입구 폭, 건물 층수, 폐기물 임시 적치 가능 여부가 다릅니다. 지역명만으로 비용을 예측하지 않고 현장 접근 조건과 철거 설비 목록을 함께 검토하세요.","마포구 폐업철거 현장에서 보행로로 폐기물을 옮겨야 한다면 주변 통행에 지장이 없는 운반 시간과 차량 정차 조건을 먼저 협의하세요. 무단 적치가 발생하지 않도록 반출 당일의 보관 장소를 정해야 합니다.","폐기물 운반이 긴 골목 점포는 해체 공정 외에 운반 인력과 이동 거리가 견적에 반영될 수 있습니다. 철거·운반·마감 항목을 나누어 비교하면 빠진 비용을 확인하기 쉽습니다.","마포구 폐업철거 전에 집기 매각이나 시설 인계를 진행한다면 최종 인수 목록과 반출 날짜를 확정하세요. 인수될 설비까지 철거하지 않도록 임대인·양수인과 범위를 확인하는 것이 좋습니다.","마포구 폐업철거 전에 시설 양도 여부가 미정이라면 양도가 성사될 때와 무산될 때의 철거 범위를 각각 정리하세요. 카운터·간판 등 인수 대상이 달라지면 폐업 일정과 원상복구 비용에도 차이가 날 수 있습니다."]},"regions/songpa/index.html":{"keyword":"송파구 폐업철거","additions":["송파구 폐업철거에서 잠실권 복합상가를 검토한다면 공사 가능 시간, 출입증, 승강기 예약, 공용 통로 보양 기준을 관리사무소에 확인하세요. 점포별 적용 규정은 다를 수 있습니다.","송파구 폐업철거 대상이 문정동 사무실이라면 임차인이 설치한 회의실 유리와 전산 배선을 건물 기본 설비와 구분해야 합니다. 기존 시설을 임의로 해체하지 않도록 인수 당시 자료와 비교하세요.","송파구 폐업철거에서 가락동 소형 점포는 간판과 실외기 배관, 출입구의 반출 동선을 함께 점검해야 합니다. 지하 점포나 계단 반출이 필요한 곳은 장비 크기와 통로 폭을 먼저 확인하세요.","송파구 폐업철거에서는 복합상가의 작업 승인과 공용부 보호, 거리 점포의 차량 접근과 외부 시설 복구가 각각 중요한 변수가 될 수 있습니다. 두 유형의 견적을 같은 조건으로 가정하지 않는 편이 정확합니다.","송파구 폐업철거 일정에서는 임대인과 합의한 반환 상태 외에도 관리주체가 요구하는 공사 신청·보양·출입 절차를 확인하세요. 두 절차를 각각 마쳐야 하는 경우가 있습니다.","승강기 사용료나 공용 통로 보양 등 건물별로 달라지는 항목이 견적에 들어 있는지 확인하세요. 견적서마다 작업 범위를 맞춘 뒤 제외 항목을 문의해야 비교가 가능합니다.","송파구 폐업철거 완료 시에는 실내 설비 마감과 공용부 사용 후 복구 상태를 나눠 촬영하세요. 임대인에게 반환할 상태와 건물 관리사무소에 확인받을 항목이 다를 수 있습니다.","송파구 폐업철거 견적에서 복합시설의 공용 통로 보호 자재와 폐기물 이동 경로가 기본 견적에 포함되는지 확인하세요. 해당 건물 규정과 실제 작업량을 확인하기 전에는 추가비용을 확정할 수 없습니다."]},"regions/yeongdeungpo/index.html":{"keyword":"영등포구 폐업철거","additions":["영등포구 폐업철거를 여의도 사무실에서 진행한다면 회의실 칸막이, 배선, 출입통제 설비를 임차인 설치물과 건물 기본 설비로 분류하세요. 공조·소방 등 공용 설비의 작업 가능 범위도 확인해야 합니다.","영등포구 폐업철거 대상인 문래동 상업공간에서는 철제 구조물이나 노출 마감이 기존 건물의 일부인지 매장에서 설치한 것인지 확인하세요. 존치할 시설과 철거할 시설을 사진으로 구분하는 편이 좋습니다.","영등포구 폐업철거에서 역 주변 점포는 영업 종료, 중고 집기 반출, 폐기물 수거를 같은 시간에 몰지 않는 편이 좋습니다. 차량 정차와 작업 가능 시간은 건물별로 확인해야 합니다.","영등포구 폐업철거에서는 사무실과 식당이 같은 면적이어도 철거 대상 설비가 다릅니다. 칸막이·OA 바닥과 후드·가스 배관을 각각 구분해 설명해야 견적 누락을 줄일 수 있습니다.","영등포구 폐업철거에 앞서 여의도 업무공간의 네트워크 장비는 사업자가 데이터 삭제와 반출 책임자를 정해야 합니다. 통신 케이블을 절단하기 전에 건물 공용망과의 연결 여부를 확인하세요.","비용 비교에서는 사무실의 전산 배선 정리와 음식점의 급배수·덕트 마감을 별개 공정으로 표시하세요. 폐기물 처리와 공용부 보양의 포함 여부도 같은 조건으로 비교해야 합니다.","영등포구 폐업철거가 끝난 뒤에는 배선·배관의 안전한 마감, 바닥·벽 손상, 폐기물 잔여 여부를 촬영하세요. 임대인에게 전달하는 인도 기록과 업체 정산 자료를 분리해 보관하는 것이 좋습니다.","영등포구 폐업철거가 예정된 업무용 건물이라면 공사 가능 시간, 승강기 예약 종료, 청소와 열쇠 인도 절차를 각각 확인하세요. 임대차 종료일을 앞두고 모든 절차를 같은 날 끝내려 하면 일정 변경이 어려울 수 있습니다."]},"regions/seongdong/index.html":{"keyword":"성동구 폐업철거","additions":["성동구 폐업철거를 성수동 쇼룸에서 준비한다면 전시벽·조명 레일·진열대 고정부를 사진에 표시하세요. 노출 배관과 바닥 중 기존 시설로 남길 부분은 임대인과 먼저 구분해야 합니다.","성동구 폐업철거 대상이 서울숲 주변 소형 매장이라면 실내 집기보다 간판 고정부나 외벽 마감에 추가 작업이 필요한지 확인하세요. 외관 변경을 되돌리는 범위는 계약과 현장 상태에 따라 달라집니다.","성동구 폐업철거에서 왕십리 음식점은 이동식 주방기기와 고정된 후드·덕트·배관을 구분해 견적받으세요. 안전한 차단과 마감은 담당 작업자가 확인해야 할 항목입니다.","성동구 폐업철거에서 노출 콘크리트나 기존 벽면을 그대로 보존해야 한다면 철거 중 손상 방지 범위를 공사 전에 정해야 합니다. 인테리어 시설을 제거하는 것과 기존 마감을 훼손하지 않는 일은 서로 다른 확인 항목입니다.","성동구 폐업철거에서는 쇼룸 집기의 소유권과 시설 양수도 여부를 먼저 정리하세요. 다음 임차인이 인수할 진열대나 조명을 철거 대상으로 잘못 포함하지 않도록 목록을 확인하는 편이 좋습니다.","전경 사진만으로는 천장 레일 조명이나 바닥 고정 구조물을 확인하기 어렵습니다. 고정부와 배선 연결, 외관의 간판 고정 위치를 확대 촬영해 상담 시 함께 전달하세요.","성동구 폐업철거 일정은 집기 회수일, 고정 설비 해체일, 폐기물 수거일, 점포 인도일을 따로 정리하세요. 매장 전시용 가구를 외부로 반출해야 한다면 동선과 차량 정차도 확인해야 합니다.","성동구 폐업철거 현장의 노출 바닥과 기존 벽면은 철거 후 남겨야 할 상태를 사진으로 합의해 두세요. 매장 콘셉트로 사용한 기존 마감을 임의로 제거하거나 덮지 않도록 보호 범위를 견적서에 적는 것이 좋습니다."]}}''')
          TODAY = datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
          BASE = 'https://cheolgeo-plan.github.io/'


          def replace_one(source, pattern, replacement, label):
              new, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise ValueError(f'Expected one match for {label}; got {count}')
              return new


          def visible_text(source):
              return html.unescape(re.sub(r'<[^>]*>', '', source))


          def update_article_blocks(source, keyword, additions, filename):
              block_re = re.compile(r'(<section class="article-block" id="section-(\d+)">)(.*?)(</section>)', re.S)
              found = [int(m.group(2)) for m in block_re.finditer(source)]
              expected = list(range(1, len(additions)+1))
              if found != expected:
                  raise ValueError(f'{filename}: unexpected article sections {found}; expected {expected}')
              changed = 0

              def transform(m):
                  nonlocal changed
                  number = int(m.group(2))
                  content = m.group(3)
                  extra = additions[number-1]
                  encoded = html.escape(extra, quote=False)
                  # Subsequent 'apply' runs must not add duplicate paragraphs.
                  if '<p class="seo-detail">' in content:
                      if encoded not in content:
                          raise ValueError(f'{filename} section {number}: existing custom detail differs; review manually')
                  else:
                      close = re.search(r'</p>', content)
                      if not close:
                          raise ValueError(f'{filename} section {number}: no introductory paragraph')
                      content = content[:close.end()] + '\n  <p class="seo-detail">' + encoded + '</p>' + content[close.end():]
                      changed += 1
                  if keyword not in visible_text(content):
                      raise ValueError(f'{filename} section {number} is missing exact keyword {keyword}')
                  return m.group(1) + content + m.group(4)

              updated = block_re.sub(transform, source)
              return updated,changed


          def change_section_heading(source, css_class, keyword, label):
              pat = r'(<section class="' + re.escape(css_class) + r'">[\s\S]*?<h2>)([^<]*)(</h2>)'
              def put(m):
                  current = m.group(2)
                  if keyword in current:
                      return m.group(0)
                  if css_class == 'article-faq':
                      new = f'{keyword} 자주 묻는 질문'
                  else:
                      new = f'{keyword} 관련 안내 더 보기'
                  return m.group(1)+new+m.group(3)
              return replace_one(source, pat, put, label)


          def update_last_modified(source):
              source = replace_one(source, r'(<meta property="article:modified_time" content=")[^"]*(">)',
                                   lambda m:m.group(1)+TODAY+m.group(2), 'article modified time')
              source = replace_one(source, r'(게시 \d{4}-\d\d-\d\d · 수정 )\d{4}-\d\d-\d\d',
                                   lambda m:m.group(1)+TODAY, 'visible modified date')
              pattern = r'(<script type="application/ld\+json">)([\s\S]*?)(</script>)'
              m = re.search(pattern, source)
              if not m:
                  raise ValueError('Cannot find JSON-LD')
              data = json.loads(m.group(2))
              web_pages = [x for x in data.get('@graph',[]) if x.get('@type')=='WebPage']
              if len(web_pages)!=1:
                  raise ValueError('Unexpected structured data WebPage count')
              web_pages[0]['dateModified'] = TODAY
              updated_data = json.dumps(data,ensure_ascii=False,separators=(', ', ': '))
              return source[:m.start(2)]+updated_data+source[m.end(2):]


          def edit_one(filename,spec):
              file = Path(filename)
              if not file.is_file():
                  raise FileNotFoundError(filename)
              original = file.read_text(encoding='utf-8')
              title = re.search(r'<title>([^<]*)</title>',original)
              desc = re.search(r'<meta name="description" content="([^"]*)"',original)
              original_h1 = re.search(r'<h1>([^<]*)</h1>',original)
              if not title or not desc or not original_h1:
                  raise ValueError(filename+' missing title/description/H1')
              keyword = spec['keyword']
              for label,contents in [('title',title.group(1)),('description',desc.group(1)),('H1',original_h1.group(1))]:
                  if keyword not in contents:
                      raise ValueError(f'{filename}: expected {keyword} in {label}')
              updated, inserted = update_article_blocks(original,keyword,spec['additions'],filename)
              updated = change_section_heading(updated,'article-faq',keyword,filename+' FAQ')
              updated = change_section_heading(updated,'related-section',keyword,filename+' related')
              if updated != original:
                  updated = update_last_modified(updated)
              # Safeguards: head-only SEO data remain stable except the legitimate modification date.
              for element in ('<title>'+title.group(1)+'</title>', '<meta name="description" content="'+desc.group(1)+'">'):
                  if element not in updated:
                      raise ValueError(filename+' unexpectedly changed existing head metadata')
              for marker in ('naver-site-verification','google-site-verification', 'landing-consultation.webp', 'target="_blank"'):
                  if updated.count(marker)!=original.count(marker):
                      raise ValueError(filename+' changed protected marker '+marker)
              form_token='1FAIpQLSfdzNitwdwclnvlcy6wj8D73z8kBuRSHsiyCp-L3XB9agx9bQ'
              if updated.count(form_token)!=original.count(form_token):
                  raise ValueError(filename+' changed Google Form links')
              if re.search(r'<meta property="article:published_time" content="([^"]*)"', updated).group(1) != \
                 re.search(r'<meta property="article:published_time" content="([^"]*)"', original).group(1):
                  raise ValueError(filename+' changed original publication date')
              if f'<link rel="canonical" href="{BASE+filename.removesuffix("index.html")}">' not in updated:
                  raise ValueError(filename+' has unexpected canonical URL')
              if updated != original:
                  file.write_text(updated,encoding='utf-8')
              return (updated != original), inserted


          def main():
              sitemap_file=Path('sitemap.xml')
              sitemap=sitemap_file.read_text(encoding='utf-8')
              changed=0
              n_sections=0
              for filename,spec in SPECS.items():
                  did,sections=edit_one(filename,spec)
                  n_sections+=sections
                  if did:
                      changed+=1
                      url=BASE+filename.removesuffix('index.html')
                      pattern=r'(<loc>'+re.escape(url)+r'</loc>\s*<lastmod>)[^<]+(</lastmod>)'
                      sitemap=replace_one(sitemap,pattern,lambda m:m.group(1)+TODAY+m.group(2),filename+' sitemap lastmod')
                  print(f'{filename} [{spec["keyword"]}]: {"MODIFIED" if did else "UNCHANGED"}; new paragraphs: {sections}')
              if changed:
                  sitemap_file.write_text(sitemap,encoding='utf-8')
              print(f'PASS: total pages updated {changed}/11; new paragraphs {n_sections}/76; verified each of 76 article sections includes its page keyword.')
              print('Title, Description, H1, public URL, existing images/forms, original publication date preserved.')

          if __name__=='__main__':
              main()
          PY
